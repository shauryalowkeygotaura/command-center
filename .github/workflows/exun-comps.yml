name: Exun comps scout

# Reads Exun's public symposium sheet each morning, picks the inter-school
# events worth signing up for (build / AI / pitch over gaming and quizzes),
# and writes them into LOCK IN as dated items. Picks that pass their date,
# fill up, or get your name on them drop out on the next run. No secrets.

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 06:00 IST; daily because deadlines land 2-3 days out
  workflow_dispatch: # run on demand from the Actions tab

permissions:
  contents: write # commit the picks back to the repo
  actions: write # dispatch deploy.yml so LOCK IN shows them

concurrency:
  group: exun-comps
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick comps from the Exun sheet
        run: python scripts/exun_comps.py

      - name: Commit if the picks changed
        id: commit
        run: |
          git config user.name "exun-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lockin.json data/lockin-scores.json data/exun-comps.json
          # The checked date changes every run; only commit when a pick did.
          if git diff --cached --quiet -- data/lockin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Same picks as last run, nothing to commit."
          else
            git commit -m "data: exun comps $(date -u +%F)"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by GITHUB_TOKEN does not trigger deploy.yml's push event
      # (loop guard), so dispatch it explicitly to serve the new list.
      - name: Trigger Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
